<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b1016">
  <title>SKYNAV</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <section id="home" class="screen active">
    <div class="stack">
      <h1>SKYNAV</h1>
      <p class="honesty">כפתור אחד. הטלפון מוצא אותך ואת השמש.</p>
      <button type="button" class="primary huge" id="btnGo">מצא מיקום</button>
      <p class="status" id="homeStatus"></p>
    </div>
  </section>

  <section id="aim" class="screen">
    <div class="stack">
      <div class="video-wrap">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="overlay" class="overlay"></canvas>
        <div class="reticle" id="reticle"></div>
      </div>
      <p class="status" id="aimStatus">כוון את העיגול לשמש</p>
      <button type="button" class="primary huge" id="btnShoot">צלם</button>
      <button type="button" class="ghost" id="btnSkipCam">דלג — רק מיקום GPS</button>
    </div>
  </section>

  <section id="result" class="screen">
    <div class="stack">
      <h1>המיקום</h1>
      <div class="card" id="resultCard"></div>
      <button type="button" class="primary huge" id="btnAgain">שוב</button>
    </div>
  </section>

  <canvas id="work" width="320" height="240"></canvas>
  <script src="celestial.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
